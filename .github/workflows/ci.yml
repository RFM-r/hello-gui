name: Release

on:
  push:
    tags:
      - 'v*'          # срабатывает при пуше тега v1.0.0, v2.3.1 и т.д.

permissions:
  contents: write     # нужно для создания Release и загрузки ассетов

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libgl1-mesa-dev \
                xorg-dev \
                libx11-dev \
                libxcursor-dev \
                libxrandr-dev \
                libxinerama-dev \
                libxi-dev \
                libxxf86vm-dev

          # ── macOS (Intel + Apple Silicon) ──────────
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            deps: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            deps: ""

          # ── Windows ────────────────────────────────
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            deps: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.deps }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o hello-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hello-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
